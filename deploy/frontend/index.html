<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vMix Schedule 44 - Powered by IGNACE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #080808;
            color: #ddd;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .config-panel {
            background: #0f0f0f;
            border-bottom: 1px solid #222;
            padding: 12px 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 13px;
        }

        .config-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .config-group label {
            color: #aaa;
            font-weight: bold;
        }

        .config-group input {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 3px;
            width: 50px;
            font-size: 12px;
        }

        .btn-save {
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .btn-save:hover {
            background: #333;
            color: #ccc;
        }

        .monitor {
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            padding: 15px;
            display: flex;
            gap: 30px;
            align-items: center;
            min-height: 130px;
        }

        .monitor-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-vivo {
            background: transparent;
            color: #00f2ff;
            border: 2px solid #00f2ff;
            padding: 15px 25px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 140px;
            text-align: center;
        }

        .btn-auto {
            background: #004422;
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 140px;
        }

        .btn-auto.off {
            background: #441111;
            color: #ff6666;
            border-color: #ff6666;
        }

        .monitor-center {
            flex: 1;
            text-align: center;
        }

        .status-main {
            font-size: 32px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .status-next {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .status-tanda {
            font-size: 13px;
            color: #00f2ff;
            font-weight: bold;
        }

        .clock {
            font-size: 56px;
            color: #00f2ff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-align: center;
            min-width: 200px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #222;
            background: #0a0a0a;
        }

        .tab-btn {
            background: #111;
            color: #777;
            border: 1px solid #222;
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            border-bottom: none;
        }

        .tab-btn.active {
            color: #00f2ff;
            border-bottom: 2px solid #00f2ff;
            background: #181818;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: auto;
            padding: 15px;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .tab-inner {
            display: flex;
            gap: 15px;
            flex: 1;
        }

        .day-tabs {
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            min-width: 120px;
        }

        .day-tab {
            background: #0f0f0f;
            border: 1px solid #222;
            padding: 10px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            color: #666;
        }

        .day-tab.active {
            background: #1a3a5c;
            color: #00f2ff;
            border-left: 3px solid #00f2ff;
        }

        .events-list {
            flex: 1;
            overflow-y: auto;
        }

        .event-item {
            background: #0f0f0f;
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .event-item:hover {
            background: #1a1a1a;
            border-color: #333;
        }

        .event-item.selected {
            background: #1a3a5c;
            border-color: #00f2ff;
        }

        .event-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-edit, .btn-delete {
            background: transparent;
            color: #999;
            border: 1px solid #444;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
        }

        .btn-edit:hover {
            color: #00f2ff;
            border-color: #00f2ff;
        }

        .btn-delete:hover {
            color: #ff6666;
            border-color: #ff6666;
        }

        .footer {
            background: #0f0f0f;
            border-top: 1px solid #222;
            padding: 12px 15px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-add {
            background: #00f2ff;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-add:hover {
            background: #00d9e6;
        }

        .btn-delete-event {
            background: #331111;
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete-event:hover {
            background: #441111;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 6px;
            width: 400px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: white;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 3px;
            font-size: 13px;
        }

        .form-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-cancel, .btn-save-event {
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .btn-cancel:hover {
            background: #222;
        }

        .btn-save-event {
            background: #00f2ff;
            color: black;
            border: none;
        }

        .btn-save-event:hover {
            background: #00d9e6;
        }

        .logs-container {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff88;
            padding: 10px;
        }

        .log-line {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .log-time {
            color: #666;
        }

        .log-message {
            color: #00f2ff;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="config-panel">
            <div class="config-group" style="flex: 1; flex-direction: column; gap: 4px;">
				<label>📡 VMIX URL:</label>
				<input type="text" id="cfg-vmix" placeholder="http://192.168.192.140:8098/" style="width: 100%; padding: 6px;">
            </div>
            <div class="config-group">
                <label>SPOTS:</label>
                <input type="number" id="cfg-spots" min="1" max="20" value="4">
            </div>
            <div class="config-group">
                <label>JINGLE IN:</label>
                <input type="number" id="cfg-inicio" value="14">
            </div>
            <div class="config-group">
                <label>JINGLE OUT:</label>
                <input type="number" id="cfg-cierre" value="16">
            </div>
            <button class="btn-save" onclick="saveConfig()">APLICAR</button>
			<button class="btn-save" style="background: #333; margin-left: 10px;" onclick="testVmix()">🔧 TEST</button>
        </div>

        <div class="monitor">
            <div class="monitor-left">
                <button class="btn-vivo">EN VIVO</button>
                <button class="btn-auto" id="btn-auto" onclick="toggleAuto()">AUTO: ON</button>
            </div>

            <div class="monitor-center">
                <div class="status-main" id="status-main">CONECTANDO...</div>
                <div class="status-next" id="status-prog">PRÓX. PROG: --:--:--</div>
                <div class="status-tanda" id="status-tanda">PRÓX. TANDA: --:--:--</div>
            </div>

            <div class="clock" id="clock">00:00:00</div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(0)">PROGRAMAS</button>
                <button class="tab-btn" onclick="switchTab(1)">TANDAS</button>
                <button class="tab-btn" onclick="switchTab(2)">LOGS</button>
            </div>

            <div class="tab-content active">
                <div class="tab-inner">
                    <div class="day-tabs" id="prog-days"></div>
                    <div class="events-list" id="prog-list"></div>
                </div>
            </div>

            <div class="tab-content">
                <div class="tab-inner">
                    <div class="day-tabs" id="tanda-days"></div>
                    <div class="events-list" id="tanda-list"></div>
                </div>
            </div>

            <div class="tab-content">
                <div class="logs-container" id="logs-container"></div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-add" onclick="openAddDialog()">+ AGREGAR</button>
            <button class="btn-delete-event" onclick="deleteEvent()">ELIMINAR</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Agregar Evento</div>
            <form onsubmit="saveEvent(event)">
                <div class="form-group">
                    <label>HORA (HH:MM:SS):</label>
                    <input type="text" id="form-time" placeholder="12:30:00" pattern="\d{2}:\d{2}:\d{2}">
                </div>
                <div class="form-group" id="form-name-group">
                    <label>ID INPUT:</label>
                    <input type="text" id="form-name" placeholder="Ej: 12">
                </div>
                <div class="form-group" id="form-list-group" style="display: none;">
                    <label>ID LISTA:</label>
                    <input type="number" id="form-list" min="1">
                </div>
                <div class="form-group" id="form-spots-group" style="display: none;">
                    <label>SPOTS:</label>
                    <input type="number" id="form-spots" min="1" max="20" value="4">
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" onclick="closeModal()">CANCELAR</button>
                    <button type="submit" class="btn-save-event">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DAYS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
        let currentTab = 0, currentDay = "Lunes", selectedEventIdx = null, isEditMode = false;
        let db = {}, config = {}, autoEnabled = true;

        async function init() {
            await loadDB();
            await loadConfig();
            setupUI();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(updateStatus, 2000);
            setInterval(pollLogs, 2000);
            updateStatus();
            refreshUI();
        }

        function setupUI() {
            const progDaysDiv = document.getElementById('prog-days');
            const tandaDaysDiv = document.getElementById('tanda-days');
            DAYS.forEach(day => {
                const p = document.createElement('button');
                p.className = 'day-tab' + (day === 'Lunes' ? ' active' : '');
                p.textContent = day;
                p.onclick = () => selectDay('prog', day);
                progDaysDiv.appendChild(p);

                const t = document.createElement('button');
                t.className = 'day-tab' + (day === 'Lunes' ? ' active' : '');
                t.textContent = day;
                t.onclick = () => selectDay('tanda', day);
                tandaDaysDiv.appendChild(t);
            });
        }

        async function loadDB() {
            const res = await fetch('/api/db');
            db = await res.json();
        }

        async function loadConfig() {
            const res = await fetch('/api/config');
            config = await res.json();
            document.getElementById('cfg-vmix').value = config.VMIX_URL || 'http://192.168.192.140:8098/api/';
            document.getElementById('cfg-spots').value = config.PUBLIS_POR_BLOQUE || 4;
            document.getElementById('cfg-inicio').value = config.INICIO_PUBLIS_INPUT || 14;
            document.getElementById('cfg-cierre').value = config.CIERRE_PUBLIS_INPUT || 16;
        }

        async function saveConfig() {
            config.VMIX_URL = document.getElementById('cfg-vmix').value.trim();
            config.PUBLIS_POR_BLOQUE = parseInt(document.getElementById('cfg-spots').value);
            config.INICIO_PUBLIS_INPUT = document.getElementById('cfg-inicio').value;
            config.CIERRE_PUBLIS_INPUT = document.getElementById('cfg-cierre').value;
            await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
            alert('✅ Guardado');
        }

			async function testVmix() {
            const result = await fetch('/api/vmix/test').then(r => r.json());
            
				let msg = `📡 URL: ${resu										msg += `🌐 DNS: ${result.dns}\n`;
				msg += `━━━━━━━━━━━━━━━━━━								if (result.diagnostics && result.diagnostics.length > 0) {
					msg += result.d						oin('\n') + '\n';
				}
            
            if (result.status === 'conectado') {
                alert('✅ vMix CONECTADO\n\n' + msg);
			} else if (result.					connection_error') {
				alert('❌ NO SE CONECTA\n\n' + msg + '\nVerifica firewall y que vMix esté corriendo');
			} else if (re					=== 'timeout') {
								️ T				OUT\n\n' + msg + '\nLa red e					o vMix no responde');
            } else {
				alert('⚠️ DIAGNÓSTIg);
            }
        }
        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.vmix && data.vmix.entrada_activa) {
                    document.getElementById('status-main').textContent = `ENTRADA ${data.vmix.entrada_activa}`;
                }

                if (data.next_programa) {
                    const prog = data.next_programa;
                    document.getElementById('status-prog').textContent = `PRÓX. PROG: ${prog.name} @ ${prog.time}`;
                }

                if (data.next_tanda) {
                    const tanda = data.next_tanda;
                    document.getElementById('status-tanda').textContent = `PRÓX. TANDA: LISTA ${tanda.list_id} @ ${tanda.time}`;
                }

                autoEnabled = data.auto_enabled;
                const autoBtn = document.getElementById('btn-auto');
                if (autoEnabled) {
                    autoBtn.textContent = 'AUTO: ON';
                    autoBtn.classList.remove('off');
                } else {
                    autoBtn.textContent = 'AUTO: OFF';
                    autoBtn.classList.add('off');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function toggleAuto() {
            await fetch('/api/auto/toggle', { method: 'POST' });
        }

        async function pollLogs() {
            if (currentTab !== 2) return;
            try {
                const res = await fetch('/api/logs?lines=100');
                const data = await res.json();
                const container = document.getElementById('logs-container');
                container.innerHTML = data.logs.map(line => {
                    const match = line.match(/\[(.*?)\] (.*)/);
                    if (match) {
                        return `<div class="log-line"><span class="log-time">${match[1]}</span> <span class="log-message">${match[2]}</span></div>`;
                    }
                    return `<div class="log-line">${line}</div>`;
                }).join('');
                container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error(e);
            }
        }

        function updateClock() {
            const now = new Date();
            const hms = now.toTimeString().split(' ')[0];
            document.getElementById('clock').textContent = hms;
        }

        function switchTab(tabIdx) {
            currentTab = tabIdx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === tabIdx));
            document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === tabIdx));
            if (tabIdx === 2) pollLogs();
        }

        function selectDay(type, day) {
            currentDay = day;
            document.querySelectorAll(`#${type}-days .day-tab`).forEach(b => b.classList.toggle('active', b.textContent === day));
            refreshUI();
        }

        function refreshUI() {
            const type = currentTab === 0 ? 'programas' : 'tandas';
            const listDiv = currentTab === 0 ? document.getElementById('prog-list') : document.getElementById('tanda-list');
            const events = db[type]?.[currentDay] || [];
            
            listDiv.innerHTML = events.map((ev, idx) => {
                const display = currentTab === 0 
                    ? `🕒 ${ev.time} | INPUT: ${ev.name}`
                    : `📺 ${ev.time} | LISTA: ${ev.list_id} | SPOTS: ${ev.spots}`;
                
                return `
                    <div class="event-item" onclick="selectEvent(${idx})" id="event-${idx}">
                        <span>${display}</span>
                        <div class="event-buttons">
                            <button class="btn-edit" onclick="editEvent(${idx}, event)">✏️</button>
                            <button class="btn-delete" onclick="deleteEventAt(${idx}, event)">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectEvent(idx) {
            selectedEventIdx = idx;
            document.querySelectorAll('.event-item').forEach((e, i) => e.classList.toggle('selected', i === idx));
        }

        function openAddDialog() {
            isEditMode = false;
            selectedEventIdx = null;
            document.getElementById('modal-title').textContent = 'Agregar Evento';
            document.getElementById('form-time').value = '';
            document.getElementById('form-name').value = '';
            document.getElementById('form-list').value = '';
            document.getElementById('form-spots').value = '4';
            
            const isProgram = currentTab === 0;
            document.getElementById('form-name-group').style.display = isProgram ? 'block' : 'none';
            document.getElementById('form-list-group').style.display = isProgram ? 'none' : 'block';
            document.getElementById('form-spots-group').style.display = isProgram ? 'none' : 'block';
            
            document.getElementById('modal').classList.add('active');
        }

        function editEvent(idx, event) {
            event.stopPropagation();
            isEditMode = true;
            selectedEventIdx = idx;
            
            const type = currentTab === 0 ? 'programas' : 'tandas';
            const ev = db[type]?.[currentDay]?.[idx];
            if (!ev) return;
            
            document.getElementById('modal-title').textContent = 'Editar Evento';
            document.getElementById('form-time').value = ev.time;
            document.getElementById('form-name').value = ev.name || '';
            document.getElementById('form-list').value = ev.list_id || '';
            document.getElementById('form-spots').value = ev.spots || 4;
            
            const isProgram = currentTab === 0;
            document.getElementById('form-name-group').style.display = isProgram ? 'block' : 'none';
            document.getElementById('form-list-group').style.display = isProgram ? 'none' : 'block';
            document.getElementById('form-spots-group').style.display = isProgram ? 'none' : 'block';
            
            document.getElementById('modal').classList.add('active');
        }

        function deleteEventAt(idx, event) {
            event.stopPropagation();
            if (confirm('¿Eliminar?')) {
                const type = currentTab === 0 ? 'programas' : 'tandas';
                db[type][currentDay].splice(idx, 1);
                refreshUI();
                fetch(`/api/events/${type}/${currentDay}?idx=${idx}`, { method: 'DELETE' });
            }
        }

        function deleteEvent() {
            if (selectedEventIdx === null) {
                alert('Selecciona un evento');
                return;
            }
            deleteEventAt(selectedEventIdx, {stopPropagation: () => {}});
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function saveEvent(event) {
            event.preventDefault();
            
            const time = document.getElementById('form-time').value;
            const type = currentTab === 0 ? 'programas' : 'tandas';
            
            let eventData;
            if (currentTab === 0) {
                eventData = { time, name: document.getElementById('form-name').value };
            } else {
                eventData = {
                    time,
                    list_id: document.getElementById('form-list').value,
                    spots: parseInt(document.getElementById('form-spots').value)
                };
            }
            
            if (isEditMode && selectedEventIdx !== null) {
                db[type][currentDay][selectedEventIdx] = eventData;
                await fetch(`/api/events/${type}/${currentDay}?idx=${selectedEventIdx}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(eventData)
                });
            } else {
                if (!db[type][currentDay]) db[type][currentDay] = [];
                db[type][currentDay].push(eventData);
                db[type][currentDay].sort((a, b) => a.time.localeCompare(b.time));
                await fetch(`/api/events/${type}/${currentDay}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(eventData)
                });
            }
            
            closeModal();
            await loadDB();
            refreshUI();
        }

        init();
    </script>
</body>
</html>
