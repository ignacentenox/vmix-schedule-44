<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>vMix Schedule 44 - Control de Automatización</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: #0a0a0a;
			color: #fff;
			overflow-x: hidden;
		}

		/* Header */
		.header {
			background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
			border-bottom: 2px solid #00f2ff;
			padding: 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			box-shadow: 0 4px 20px rgba(0, 242, 255, 0.2);
		}

		.header h1 {
			font-size: 28px;
			font-weight: 700;
			color: #00f2ff;
			letter-spacing: 1px;
		}

		.header-right {
			display: flex;
			gap: 20px;
			align-items: center;
		}

		.status-indicator {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 16px;
			background: #111;
			border-radius: 20px;
			border: 1px solid #333;
		}

		.status-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #00ff00;
			animation: pulse 2s infinite;
		}

		.status-dot.offline {
			background: #ff3333;
			animation: none;
		}

		@keyframes pulse {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.5;
			}
		}

		/* Container */
		.container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}

		/* Monitor */
		.monitor {
			background: #111;
			border: 2px solid #00f2ff;
			border-radius: 8px;
			padding: 30px;
			margin-bottom: 30px;
			text-align: center;
		}

		.monitor-entrada {
			font-size: 48px;
			font-weight: 800;
			color: #00f2ff;
			letter-spacing: 2px;
			margin-bottom: 15px;
			font-family: 'Consolas', monospace;
		}

		.monitor-tiempo {
			font-size: 36px;
			color: #aaa;
			font-family: 'Consolas', monospace;
			margin-top: 10px;
		}

		/* Controles */
		.controls {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
			gap: 20px;
			margin-bottom: 30px;
		}

		.control-card {
			background: #111;
			border: 1px solid #333;
			border-radius: 8px;
			padding: 20px;
			transition: all 0.3s ease;
		}

		.control-card:hover {
			border-color: #00f2ff;
			box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
		}

		.control-card h3 {
			color: #00f2ff;
			margin-bottom: 15px;
			font-size: 16px;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		/* Botones */
		button {
			padding: 12px 24px;
			border: none;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.btn-primary {
			background: #00f2ff;
			color: #000;
		}

		.btn-primary:hover {
			background: #00d9ff;
			box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
		}

		.btn-danger {
			background: #ff3333;
			color: #fff;
		}

		.btn-danger:hover {
			background: #ff1a1a;
		}

		.btn-success {
			background: #00aa00;
			color: #fff;
		}

		.btn-success:hover {
			background: #00cc00;
		}

		.btn-toggle-on {
			background: #00aa00;
			color: #fff;
			width: 100%;
		}

		.btn-toggle-off {
			background: #aa0000;
			color: #fff;
			width: 100%;
		}

		/* Inputs */
		input,
		select {
			width: 100%;
			padding: 10px;
			margin: 10px 0;
			background: #1a1a1a;
			border: 1px solid #333;
			color: #fff;
			border-radius: 4px;
			font-size: 14px;
		}

		input:focus,
		select:focus {
			outline: none;
			border-color: #00f2ff;
			box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
		}

		/* Tabs */
		.tabs {
			display: flex;
			gap: 10px;
			margin-bottom: 20px;
			border-bottom: 2px solid #222;
		}

		.tab-btn {
			padding: 12px 24px;
			background: transparent;
			border: none;
			color: #777;
			cursor: pointer;
			font-weight: 600;
			border-bottom: 2px solid transparent;
			transition: all 0.3s ease;
			text-transform: uppercase;
			font-size: 12px;
		}

		.tab-btn.active {
			color: #00f2ff;
			border-bottom-color: #00f2ff;
		}

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* Events List */
		.events-table {
			width: 100%;
			background: #111;
			border-radius: 8px;
			overflow: hidden;
			border: 1px solid #333;
		}

		.events-table thead {
			background: #1a1a1a;
			border-bottom: 2px solid #00f2ff;
		}

		.events-table th {
			padding: 15px;
			text-align: left;
			color: #00f2ff;
			font-weight: 600;
			text-transform: uppercase;
			font-size: 12px;
			letter-spacing: 1px;
		}

		.events-table td {
			padding: 12px 15px;
			border-bottom: 1px solid #222;
		}

		.events-table tr:hover {
			background: #1a1a1a;
		}

		/* Alert */
		.alert {
			padding: 15px;
			margin: 10px 0;
			border-radius: 6px;
			display: none;
		}

		.alert.show {
			display: block;
		}

		.alert-success {
			background: #004400;
			border: 1px solid #00aa00;
			color: #00ff00;
		}

		.alert-error {
			background: #440000;
			border: 1px solid #ff3333;
			color: #ff6666;
		}

		.alert-info {
			background: #004444;
			border: 1px solid #00aaaa;
			color: #00ffff;
		}

		/* Grid */
		.grid-2 {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
		}

		@media (max-width: 768px) {
			.grid-2 {
				grid-template-columns: 1fr;
			}

			.monitor-entrada {
				font-size: 32px;
			}

			.monitor-tiempo {
				font-size: 24px;
			}

			.header h1 {
				font-size: 20px;
			}
		}

		/* Loading */
		.loader {
			display: inline-block;
			width: 20px;
			height: 20px;
			border: 3px solid rgba(0, 242, 255, 0.3);
			border-radius: 50%;
			border-top-color: #00f2ff;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		/* Info Box */
		.info-box {
			background: #1a1a1a;
			border-left: 4px solid #00f2ff;
			padding: 15px;
			margin: 10px 0;
			border-radius: 4px;
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>🎬 vMix Schedule 44</h1>
		<div class="header-right">
			<div class="status-indicator">
				<div class="status-dot" id="statusDot"></div>
				<span id="statusText">Conectando...</span>
			</div>
		</div>
	</div>

	<div class="container">
		<!-- Monitor -->
		<div class="monitor">
			<div>Entrada Actual</div>
			<div class="monitor-entrada" id="monitorEntrada">--:--:--</div>
			<div class="monitor-tiempo" id="monitorTiempo">00:00:00</div>
		</div>

		<!-- Alert -->
		<div id="alert" class="alert"></div>

		<!-- Controles Principales -->
		<div class="controls">
			<div class="control-card">
				<h3>🎮 Automatización</h3>
				<button id="btnAuto" class="btn-toggle-on" onclick="toggleAuto()">AUTO: ON</button>
				<p style="margin-top: 10px; font-size: 12px; color: #777;">
					<span id="autoStatus">Activa</span>
				</p>
			</div>

			<div class="control-card">
				<h3>📊 Estado del Sistema</h3>
				<div id="systemStats">
					<p>Programas: <strong id="totalPrograms">0</strong></p>
					<p>Tandas: <strong id="totalTandas">0</strong></p>
					<p>vMix: <strong id="vmixStatus">Desconectado</strong></p>
				</div>
			</div>

			<div class="control-card">
				<h3>⚙️ Configuración</h3>
				<button class="btn-primary" onclick="showConfigModal()">Editar Configuración</button>
				<button class="btn-primary" onclick="refreshStatus()" style="margin-top: 10px;">Actualizar
					Estado</button>
			</div>
		</div>

		<!-- Tabs -->
		<div class="tabs">
			<button class="tab-btn active" onclick="switchTab('eventos')">📅 Eventos</button>
			<button class="tab-btn" onclick="switchTab('programs')">🎬 Programas</button>
			<button class="tab-btn" onclick="switchTab('tandas')">📺 Tandas</button>
			<button class="tab-btn" onclick="switchTab('logs')">📝 Logs</button>
		</div>

		<!-- Tab: Eventos -->
		<div id="eventos" class="tab-content active">
			<div class="control-card">
				<h3>➕ Agregar Evento</h3>
				<input type="date" id="eventDate" placeholder="Fecha">
				<input type="time" id="eventTime" placeholder="Hora">
				<input type="text" id="eventName" placeholder="Nombre / ID Input">
				<select id="eventType">
					<option value="programa">Programa</option>
					<option value="tanda">Tanda Publicitaria</option>
				</select>
				<button class="btn-primary" onclick="addEvent()" style="width: 100%; margin-top: 10px;">
					Agregar Evento
				</button>
			</div>

			<div style="margin-top: 20px;" id="eventsList"></div>
		</div>

		<!-- Tab: Programas -->
		<div id="programs" class="tab-content">
			<table class="events-table">
				<thead>
					<tr>
						<th>Día</th>
						<th>Hora</th>
						<th>Input</th>
						<th>Acción</th>
					</tr>
				</thead>
				<tbody id="programsTable"></tbody>
			</table>
		</div>

		<!-- Tab: Tandas -->
		<div id="tandas" class="tab-content">
			<table class="events-table">
				<thead>
					<tr>
						<th>Día</th>
						<th>Hora</th>
						<th>Lista ID</th>
						<th>Spots</th>
						<th>Acción</th>
					</tr>
				</thead>
				<tbody id="tandasTable"></tbody>
			</table>
		</div>

		<!-- Tab: Logs -->
		<div id="logs" class="tab-content">
			<button class="btn-primary" onclick="loadLogs()" style="margin-bottom: 15px;">Cargar Logs</button>
			<div
				style="background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: 'Consolas', monospace; font-size: 12px; max-height: 500px; overflow-y: auto;">
				<div id="logsContent">Haz click en "Cargar Logs"...</div>
			</div>
		</div>
	</div>

	<script>
		const API_URL = '/api';
		const POLL_INTERVAL = 2000; // 2 segundos

		// --- INICIALIZACIÓN ---
		function init() {
			console.log('🚀 Iniciando aplicación...');
			refreshStatus();
			loadEvents();
			setInterval(refreshStatus, POLL_INTERVAL);
			updateClock();
			setInterval(updateClock, 1000);
		}

		// --- ACTUALIZACIÓN DE RELOJ ---
		function updateClock() {
			const now = new Date();
			const time = now.toLocaleTimeString('es-ES', { hour12: false });
			document.getElementById('monitorTiempo').textContent = time;
		}

		// --- ESTADO DEL SISTEMA ---
		async function refreshStatus() {
			try {
				const response = await fetch(`${API_URL}/status`);
				const data = await response.json();

				// Actualizar indicador de conexión
				const vmixOk = data.vmix.conectado;
				document.getElementById('statusDot').className = `status-dot ${vmixOk ? '' : 'offline'}`;
				document.getElementById('statusText').textContent = vmixOk ? 'vMix Conectado' : 'vMix Desconectado';

				// Monitor
				const entrada = data.vmix.entrada_activa || 'Desconectado';
				document.getElementById('monitorEntrada').textContent = entrada;

				// Auto status
				document.getElementById('autoStatus').textContent = data.auto_enabled ? '✅ Activa' : '❌ Inactiva';
				updateAutoButton(data.auto_enabled);

				// Estadísticas
				document.getElementById('totalPrograms').textContent = data.total_programas;
				document.getElementById('totalTandas').textContent = data.total_tandas;
				document.getElementById('vmixStatus').textContent = vmixOk ? '🟢 Conectado' : '🔴 Desconectado';

			} catch (error) {
				console.error('Error actualizando status:', error);
				showAlert('Error al conectar con el servidor', 'error');
			}
		}

		// --- AUTO TOGGLE ---
		async function toggleAuto() {
			try {
				const response = await fetch(`${API_URL}/auto/toggle`, { method: 'POST' });
				const data = await response.json();
				refreshStatus();
				showAlert(`Automatización ${data.auto_enabled ? 'ACTIVADA' : 'DESACTIVADA'}`, 'success');
			} catch (error) {
				showAlert('Error al cambiar automatización', 'error');
			}
		}

		function updateAutoButton(enabled) {
			const btn = document.getElementById('btnAuto');
			btn.textContent = enabled ? 'AUTO: ON ✅' : 'AUTO: OFF ❌';
			btn.className = enabled ? 'btn-toggle-on' : 'btn-toggle-off';
		}

		// --- GESTIÓN DE EVENTOS ---
		async function loadEvents() {
			try {
				const response = await fetch(`${API_URL}/events`);
				const data = await response.json();

				// Programas
				const programsBody = document.getElementById('programsTable');
				programsBody.innerHTML = '';
				for (const [dia, eventos] of Object.entries(data.programas)) {
					eventos.forEach((ev, idx) => {
						const row = `
                            <tr>
                                <td>${dia}</td>
                                <td>${ev.time}</td>
                                <td>${ev.name}</td>
                                <td>
                                    <button class="btn-danger" onclick="deleteEvent('${dia}', ${idx}, 'programa')" style="padding: 6px 12px; font-size: 12px;">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                        `;
						programsBody.innerHTML += row;
					});
				}

				// Tandas
				const tandasBody = document.getElementById('tandasTable');
				tandasBody.innerHTML = '';
				for (const [dia, eventos] of Object.entries(data.tandas)) {
					eventos.forEach((ev, idx) => {
						const row = `
                            <tr>
                                <td>${dia}</td>
                                <td>${ev.time}</td>
                                <td>${ev.list_id}</td>
                                <td>${ev.spots}</td>
                                <td>
                                    <button class="btn-danger" onclick="deleteEvent('${dia}', ${idx}, 'tanda')" style="padding: 6px 12px; font-size: 12px;">
                                        Eliminar
                                    </button>
                                </td>
                            </tr>
                        `;
						tandasBody.innerHTML += row;
					});
				}
			} catch (error) {
				console.error('Error cargando eventos:', error);
			}
		}

		async function addEvent() {
			const date = document.getElementById('eventDate').value;
			const time = document.getElementById('eventTime').value;
			const name = document.getElementById('eventName').value;
			const type = document.getElementById('eventType').value;

			if (!date || !time || !name) {
				showAlert('Completa todos los campos', 'error');
				return;
			}

			const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
			const d = new Date(date);
			const dia = diasSemana[d.getDay()];

			const evento = type === 'programa'
				? { time, name }
				: { time, list_id: name, spots: 4 };

			try {
				const response = await fetch(`${API_URL}/events`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ dia, tipo: type, evento })
				});

				if (response.ok) {
					showAlert('Evento agregado correctamente', 'success');
					document.getElementById('eventDate').value = '';
					document.getElementById('eventTime').value = '';
					document.getElementById('eventName').value = '';
					loadEvents();
				} else {
					showAlert('Error al agregar evento', 'error');
				}
			} catch (error) {
				showAlert('Error: ' + error.message, 'error');
			}
		}

		async function deleteEvent(dia, idx, tipo) {
			if (!confirm('¿Eliminar este evento?')) return;

			try {
				const response = await fetch(`${API_URL}/events/${dia}/${idx}`, {
					method: 'DELETE',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ tipo })
				});

				if (response.ok) {
					showAlert('Evento eliminado', 'success');
					loadEvents();
				}
			} catch (error) {
				showAlert('Error al eliminar evento', 'error');
			}
		}

		// --- LOGS ---
		async function loadLogs() {
			try {
				const response = await fetch(`${API_URL}/logs`);
				const data = await response.json();
				const logsDiv = document.getElementById('logsContent');
				logsDiv.innerHTML = data.logs.map(log => `<div>${escapeHtml(log)}</div>`).join('');
				logsDiv.scrollTop = logsDiv.scrollHeight;
			} catch (error) {
				showAlert('Error cargando logs', 'error');
			}
		}

		// --- TABS ---
		function switchTab(tabName) {
			// Ocultar todos los tabs
			document.querySelectorAll('.tab-content').forEach(el => {
				el.classList.remove('active');
			});

			// Desactivar todos los botones
			document.querySelectorAll('.tab-btn').forEach(el => {
				el.classList.remove('active');
			});

			// Mostrar tab seleccionado
			document.getElementById(tabName).classList.add('active');

			// Activar botón
			event.target.classList.add('active');

			if (tabName === 'logs') {
				loadLogs();
			} else if (tabName === 'programs' || tabName === 'tandas') {
				loadEvents();
			}
		}

		// --- UTILITARIOS ---
		function showAlert(message, type = 'info') {
			const alert = document.getElementById('alert');
			alert.textContent = message;
			alert.className = `alert show alert-${type}`;
			setTimeout(() => alert.classList.remove('show'), 5000);
		}

		function escapeHtml(text) {
			const map = {
				'&': '&amp;',
				'<': '&lt;',
				'>': '&gt;',
				'"': '&quot;',
				"'": '&#039;'
			};
			return text.replace(/[&<>"']/g, m => map[m]);
		}

		function showConfigModal() {
			alert('Función de configuración en desarrollo');
		}

		// Iniciar aplicación cuando carga el DOM
		document.addEventListener('DOMContentLoaded', init);
	</script>
</body>

</html>
